<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATCHDAY | Multi-Sport Predictor</title>
  <style>
    :root[data-theme="dark"] {
      --bg-color: #0b0f17;
      --card-bg: #131b2e;
      --input-bg: #1a243b;
      --text-color: #f1f5f9;
      --text-dim: #94a3b8;
      --border-color: #1e293b;
      --accent-lime: #ccff00;
      --accent-dark: #0f172a;
    }
    :root[data-theme="light"] {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --input-bg: #f1f5f9;
      --text-color: #0f172a;
      --text-dim: #64748b;
      --border-color: #e2e8f0;
      --accent-lime: #a3e635;
      --accent-dark: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      transition: background-color 0.3s, color 0.3s;
    }
    .container { max-width: 480px; margin: 0 auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .brand { font-weight: 800; font-size: 0.9rem; letter-spacing: 1px; }
    .brand span { font-weight: 400; color: var(--text-dim); }
    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .hero-title { font-size: 2rem; font-weight: 700; line-height: 1.1; margin-bottom: 8px; }
    .hero-sub { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; line-height: 1.4; }

    .sport-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-dim);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active {
      background: var(--accent-lime);
      color: var(--accent-dark);
      font-weight: 600;
      border-color: var(--accent-lime);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group input, .input-group select {
      width: 100%;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 0.9rem;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .analyze-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent-lime);
      color: var(--accent-dark);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    .result-card {
      display: none;
      background: var(--input-bg);
      border-left: 4px solid var(--accent-lime);
      padding: 16px;
      border-radius: 8px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="brand">MATCHDAY <span>/ MULTI-SPORT</span></div>
      <button class="theme-toggle" id="themeBtn">☀️ / 🌙</button>
    </div>

    <h1 class="hero-title">Read the game<br>before it happens.</h1>
    <p class="hero-sub">One workspace for five sports. Bring your numbers or search a fixture, then let the model find the edge.</p>

    <!-- Sport Selector Tabs -->
    <div class="sport-tabs">
      <button class="tab-btn active" onclick="selectSport('football', this)">Football</button>
      <button class="tab-btn" onclick="selectSport('basketball', this)">Basketball</button>
      <button class="tab-btn" onclick="selectSport('ice_hockey', this)">Ice Hockey</button>
      <button class="tab-btn" onclick="selectSport('tennis', this)">Tennis</button>
      <button class="tab-btn" onclick="selectSport('table_tennis', this)">Table Tennis</button>
    </div>

    <div class="card">
      <div class="card-title" id="cardHeader">Set Football Fixture</div>

      <div class="input-group">
        <label>Match Tier</label>
        <select id="matchTier">
          <option>Major Division - Tier 1/2</option>
          <option>Lower Division - Tier 3+</option>
        </select>
      </div>

      <div class="input-group">
        <label id="lblHomeTeam">Home Team / Player 1</label>
        <input type="text" id="homeTeam" placeholder="e.g. Home">
      </div>

      <div class="input-group">
        <label id="lblAwayTeam">Away Team / Player 2</label>
        <input type="text" id="awayTeam" placeholder="e.g. Away">
      </div>

      <div class="grid-2">
        <div class="input-group">
          <label id="lblHomeAvg">Home Scored Avg</label>
          <input type="number" id="homeAvg" step="0.1" value="1.82">
        </div>
        <div class="input-group">
          <label id="lblHomeCon">Home Conceded Avg</label>
          <input type="number" id="homeConceded" step="0.1" value="0.92">
        </div>
      </div>

      <div class="grid-2">
        <div class="input-group">
          <label id="lblAwayAvg">Away Scored Avg</label>
          <input type="number" id="awayAvg" step="0.1" value="1.34">
        </div>
        <div class="input-group">
          <label id="lblAwayCon">Away Conceded Avg</label>
          <input type="number" id="awayConceded" step="0.1" value="1.18">
        </div>
      </div>

      <button class="analyze-btn" id="analyzeBtn" onclick="runAnalysis()">Analyze Football →</button>

      <div class="result-card" id="resultCard">
        <h3 id="resTitle" style="margin-bottom: 8px;"></h3>
        <p>Projected Score / Metric: <strong id="resTotal"></strong></p>
        <p style="margin-top: 4px;">Recommended Pick: <strong id="resTip" style="color: var(--accent-lime);"></strong></p>
      </div>
    </div>
  </div>

  <script>
    let currentSport = 'football';

    const sportDefaults = {
      football: { header: 'Set Football Fixture', btn: 'Analyze Football →', scored: 'Home Avg Goals', con: 'Home Allowed Goals', awayScored: 'Away Avg Goals', awayCon: 'Away Allowed Goals', val1: 1.82, val2: 0.92, val3: 1.34, val4: 1.18 },
      basketball: { header: 'Set Basketball Fixture', btn: 'Analyze Basketball →', scored: 'Home PPG', con: 'Home Opp PPG', awayScored: 'Away PPG', awayCon: 'Away Opp PPG', val1: 108.5, val2: 102.1, val3: 104.0, val4: 106.8 },
      ice_hockey: { header: 'Set Hockey Fixture', btn: 'Analyze Ice Hockey →', scored: 'Home Goals/G', con: 'Home Conceded/G', awayScored: 'Away Goals/G', awayCon: 'Away Conceded/G', val1: 3.2, val2: 2.5, val3: 2.8, val4: 3.1 },
      tennis: { header: 'Set Tennis Match', btn: 'Analyze Tennis →', scored: 'P1 Hold % (0-100)', con: 'P1 Break % (0-100)', awayScored: 'P2 Hold % (0-100)', awayCon: 'P2 Break % (0-100)', val1: 82.0, val2: 21.0, val3: 78.0, val4: 19.0 },
      table_tennis: { header: 'Set Table Tennis Match', btn: 'Analyze Table Tennis →', scored: 'P1 Win Rate %', con: 'P1 Avg Pts/Set', awayScored: 'P2 Win Rate %', awayCon: 'P2 Avg Pts/Set', val1: 65.0, val2: 9.8, val3: 58.0, val4: 9.2 }
    };

    function selectSport(sport, btn) {
      currentSport = sport;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const config = sportDefaults[sport];
      document.getElementById('cardHeader').innerText = config.header;
      document.getElementById('analyzeBtn').innerText = config.btn;

      document.getElementById('lblHomeAvg').innerText = config.scored;
      document.getElementById('lblHomeCon').innerText = config.con;
      document.getElementById('lblAwayAvg').innerText = config.awayScored;
      document.getElementById('lblAwayCon').innerText = config.awayCon;

      document.getElementById('homeAvg').value = config.val1;
      document.getElementById('homeConceded').value = config.val2;
      document.getElementById('awayAvg').value = config.val3;
      document.getElementById('awayConceded').value = config.val4;

      document.getElementById('resultCard').style.display = 'none';
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
      const html = document.documentElement;
      const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nextTheme);
    });

    async function runAnalysis() {
      const homeTeam = document.getElementById('homeTeam').value || 'Home';
      const awayTeam = document.getElementById('awayTeam').value || 'Away';
      const homeAvg = document.getElementById('homeAvg').value;
      const homeConceded = document.getElementById('homeConceded').value;
      const awayAvg = document.getElementById('awayAvg').value;
      const awayConceded = document.getElementById('awayConceded').value;

      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sport: currentSport, homeTeam, awayTeam, homeAvg, homeConceded, awayAvg, awayConceded })
      });

      const data = await res.json();
      document.getElementById('resTitle').innerText = data.match;
      document.getElementById('resTotal').innerText = data.predictions.projectedMetric;
      document.getElementById('resTip').innerText = data.predictions.recommendedTip;
      document.getElementById('resultCard').style.display = 'block';
    }
  </script>
</body>
</html>
