<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATCHDAY - Sports Prediction Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #2563eb;
      --green: #16a34a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 4px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { opacity: 0.9; }
    .quick-box {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 2px;
    }
    .output-box {
      display: none;
      margin-top: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background: var(--green);
    }
    .scoreline {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }
    .market-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>MATCHDAY</h1>

  <div class="card">
    <label for="sportSelect">Sport</label>
    <select id="sportSelect">
      <option value="football">Football</option>
      <option value="basketball">Basketball</option>
      <option value="ice_hockey">Ice Hockey</option>
      <option value="tennis">Tennis</option>
      <option value="table_tennis">Table Tennis</option>
      <option value="volleyball">Volleyball</option>
      <option value="baseball">Baseball</option>
      <option value="american_football">American Football</option>
      <option value="cricket">Cricket</option>
      <option value="esports">Esports</option>
    </select>

    <label for="tierSelect">League Tier Level</label>
    <select id="tierSelect">
      <option value="major">Major Tier (75% Gate)</option>
      <option value="lower">Lower / Regional Tier (80% Gate)</option>
    </select>

    <div class="grid">
      <div>
        <label>Home Team / Player</label>
        <input type="text" id="homeName" placeholder="e.g. Arsenal" />
      </div>
      <div>
        <label>Away Team / Player</label>
        <input type="text" id="awayName" placeholder="e.g. Chelsea" />
      </div>
    </div>

    <!-- Quick Parser Section -->
    <label>Home Past 5 Results (Quick Fill)</label>
    <input type="text" id="homePastScores" placeholder="e.g. 2-1, 1-0, 3-1, 0-0, 2-0" oninput="parseHomeScores()" />
    <div class="quick-box" id="homeParsedStats">Auto-calculated: 0.00 Scored / 0.00 Conceded</div>

    <label>Away Past 5 Results (Quick Fill)</label>
    <input type="text" id="awayPastScores" placeholder="e.g. 0-2, 1-1, 0-1, 2-2, 1-3" oninput="parseAwayScores()" />
    <div class="quick-box" id="awayParsedStats">Auto-calculated: 0.00 Scored / 0.00 Conceded</div>

    <!-- Hidden numeric inputs (Populated automatically or manually) -->
    <div class="grid" style="display:none;">
      <input type="number" step="0.01" id="homeAvgScored" value="1.0" />
      <input type="number" step="0.01" id="homeAvgConceded" value="1.0" />
      <input type="number" step="0.01" id="awayAvgScored" value="1.0" />
      <input type="number" step="0.01" id="awayAvgConceded" value="1.0" />
    </div>

    <button onclick="runPrediction()">ANALYZE ALL MARKETS</button>
  </div>

  <!-- Output Display Card -->
  <div class="card output-box" id="resultsCard">
    <div style="text-align: center;">
      <span class="badge" id="passBadge">PASSED FILTER</span>
    </div>
    <div class="scoreline" id="expectedScore">2 - 1</div>
    <div id="marketsContainer"></div>
  </div>
</div>

<script>
  // Parsing logic for quick past results string
  function calculateAverages(scoreString) {
    const matches = scoreString.split(',').map(s => s.trim());
    let totalScored = 0;
    let totalConceded = 0;
    let count = 0;

    matches.forEach(m => {
      const parts = m.split('-').map(n => parseFloat(n.trim()));
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        totalScored += parts[0];
        totalConceded += parts[1];
        count++;
      }
    });

    if (count === 0) return { scored: 1.0, conceded: 1.0 };
    return {
      scored: parseFloat((totalScored / count).toFixed(2)),
      conceded: parseFloat((totalConceded / count).toFixed(2))
    };
  }

  function parseHomeScores() {
    const val = document.getElementById('homePastScores').value;
    const stats = calculateAverages(val);
    document.getElementById('homeAvgScored').value = stats.scored;
    document.getElementById('homeAvgConceded').value = stats.conceded;
    document.getElementById('homeParsedStats').innerText = `Auto-calculated: ${stats.scored} Scored / ${stats.conceded} Conceded`;
  }

  function parseAwayScores() {
    const val = document.getElementById('awayPastScores').value;
    const stats = calculateAverages(val);
    document.getElementById('awayAvgScored').value = stats.scored;
    document.getElementById('awayAvgConceded').value = stats.conceded;
    document.getElementById('awayParsedStats').innerText = `Auto-calculated: ${stats.scored} Scored / ${stats.conceded} Conceded`;
  }

  async function runPrediction() {
    const payload = {
      sport: document.getElementById('sportSelect').value,
      tier: document.getElementById('tierSelect').value,
      homeName: document.getElementById('homeName').value || 'Home',
      awayName: document.getElementById('awayName').value || 'Away',
      homeAvgScored: parseFloat(document.getElementById('homeAvgScored').value),
      homeAvgConceded: parseFloat(document.getElementById('homeAvgConceded').value),
      awayAvgScored: parseFloat(document.getElementById('awayAvgScored').value),
      awayAvgConceded: parseFloat(document.getElementById('awayAvgConceded').value)
    };

    try {
      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      // Render expected score as clean integers
      document.getElementById('expectedScore').innerText = `${data.expectedScore.home} - ${data.expectedScore.away}`;
      
      const badge = document.getElementById('passBadge');
      if (data.passedFilter) {
        badge.innerText = 'PASSED FILTER';
        badge.style.background = 'var(--green)';
      } else {
        badge.innerText = 'HIGH VARIANCE - SKIP';
        badge.style.background = '#dc2626';
      }

      // Render markets
      const container = document.getElementById('marketsContainer');
      container.innerHTML = '';
      data.markets.forEach(m => {
        const row = document.createElement('div');
        row.className = 'market-row';
        row.innerHTML = `<span><strong>${m.name}</strong></span><span>${m.probability}% (Odds ~${m.fairOdds})</span>`;
        container.appendChild(row);
      });

      document.getElementById('resultsCard').style.display = 'block';
    } catch (err) {
      alert('Error fetching prediction. Please check inputs.');
    }
  }
</script>
</body>
</html>
