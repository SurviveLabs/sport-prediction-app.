<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATCHDAY - Sports Prediction Engine</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #2563eb;
      --green: #16a34a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 4px;
    }
    select, input {
      width: 100%;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      box-sizing: border-box;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover { opacity: 0.9; }
    .quick-box {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 8px;
      text-align: center;
    }
    .output-box {
      display: none;
      margin-top: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      background: var(--green);
    }
    .scoreline {
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
    }
    .market-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>MATCHDAY</h1>

  <div class="card">
    <label for="sportSelect">Sport</label>
    <select id="sportSelect">
      <option value="football">Football</option>
      <option value="basketball">Basketball</option>
      <option value="ice_hockey">Ice Hockey</option>
      <option value="tennis">Tennis</option>
      <option value="table_tennis">Table Tennis</option>
      <option value="volleyball">Volleyball</option>
      <option value="baseball">Baseball</option>
      <option value="american_football">American Football</option>
      <option value="cricket">Cricket</option>
      <option value="esports">Esports</option>
    </select>

    <label for="tierSelect">League Tier Level</label>
    <select id="tierSelect">
      <option value="major">Major Tier (75% Gate)</option>
      <option value="lower">Lower / Regional Tier (80% Gate)</option>
    </select>

    <div class="grid">
      <div>
        <label for="homeName">Home Team / Player</label>
        <input type="text" id="homeName" placeholder="e.g. Arsenal" />
      </div>
      <div>
        <label for="awayName">Away Team / Player</label>
        <input type="text" id="awayName" placeholder="e.g. Chelsea" />
      </div>
    </div>

    <!-- Home Team Totals -->
    <div class="grid" style="margin-top: 10px;">
      <div>
        <label for="homeTotalScored">Home Total Scored</label>
        <input type="number" id="homeTotalScored" placeholder="e.g. 540 or 10" oninput="updateAverages()" />
      </div>
      <div>
        <label for="homeTotalConceded">Home Total Conceded</label>
        <input type="number" id="homeTotalConceded" placeholder="e.g. 510 or 4" oninput="updateAverages()" />
      </div>
    </div>

    <!-- Away Team Totals -->
    <div class="grid" style="margin-top: 10px;">
      <div>
        <label for="awayTotalScored">Away Total Scored</label>
        <input type="number" id="awayTotalScored" placeholder="e.g. 520 or 12" oninput="updateAverages()" />
      </div>
      <div>
        <label for="awayTotalConceded">Away Total Conceded</label>
        <input type="number" id="awayTotalConceded" placeholder="e.g. 490 or 8" oninput="updateAverages()" />
      </div>
    </div>

    <label for="gamesCount">Number of Games Played</label>
    <input type="number" id="gamesCount" value="5" oninput="updateAverages()" />

    <!-- Real-Time Calculated Average Display -->
    <div class="quick-box" id="calculatedAveragesDisplay">
      Home: 0.00 Scored / 0.00 Conceded | Away: 0.00 Scored / 0.00 Conceded
    </div>

    <!-- Hidden values passed to API -->
    <input type="hidden" id="homeAvgScored" value="0" />
    <input type="hidden" id="homeAvgConceded" value="0" />
    <input type="hidden" id="awayAvgScored" value="0" />
    <input type="hidden" id="awayAvgConceded" value="0" />

    <button onclick="runPrediction()">ANALYZE ALL MARKETS</button>
  </div>

  <!-- Output Display Card -->
  <div class="card output-box" id="resultsCard">
    <div style="text-align: center;">
      <span class="badge" id="passBadge">PASSED FILTER</span>
    </div>
    <div class="scoreline" id="expectedScore">0 - 0</div>
    <div id="marketsContainer"></div>
  </div>
</div>

<script>
  function updateAverages() {
    const games = parseFloat(document.getElementById('gamesCount').value) || 1;
    
    const hScored = parseFloat(document.getElementById('homeTotalScored').value) || 0;
    const hConceded = parseFloat(document.getElementById('homeTotalConceded').value) || 0;
    const aScored = parseFloat(document.getElementById('awayTotalScored').value) || 0;
    const aConceded = parseFloat(document.getElementById('awayTotalConceded').value) || 0;

    const hAvgS = (hScored / games).toFixed(2);
    const hAvgC = (hConceded / games).toFixed(2);
    const aAvgS = (aScored / games).toFixed(2);
    const aAvgC = (aConceded / games).toFixed(2);

    document.getElementById('homeAvgScored').value = hAvgS;
    document.getElementById('homeAvgConceded').value = hAvgC;
    document.getElementById('awayAvgScored').value = aAvgS;
    document.getElementById('awayAvgConceded').value = aAvgC;

    document.getElementById('calculatedAveragesDisplay').innerText = 
      `Home: ${hAvgS} Scored / ${hAvgC} Conceded | Away: ${aAvgS} Scored / ${aAvgC} Conceded`;
  }

  async function runPrediction() {
    const payload = {
      sport: document.getElementById('sportSelect').value,
      tier: document.getElementById('tierSelect').value,
      homeName: document.getElementById('homeName').value || 'Home',
      awayName: document.getElementById('awayName').value || 'Away',
      homeAvgScored: parseFloat(document.getElementById('homeAvgScored').value) || 1.0,
      homeAvgConceded: parseFloat(document.getElementById('homeAvgConceded').value) || 1.0,
      awayAvgScored: parseFloat(document.getElementById('awayAvgScored').value) || 1.0,
      awayAvgConceded: parseFloat(document.getElementById('awayAvgConceded').value) || 1.0
    };

    try {
      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
          'Cache-Control': 'no-cache'
        },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      document.getElementById('expectedScore').innerText = `${data.expectedScore.home} - ${data.expectedScore.away}`;
      
      const badge = document.getElementById('passBadge');
      if (data.passedFilter) {
        badge.innerText = 'PASSED FILTER';
        badge.style.background = 'var(--green)';
      } else {
        badge.innerText = 'HIGH VARIANCE - SKIP';
        badge.style.background = '#dc2626';
      }

      const container = document.getElementById('marketsContainer');
      container.innerHTML = '';
      data.markets.forEach(m => {
        const row = document.createElement('div');
        row.className = 'market-row';
        row.innerHTML = `<span><strong>${m.name}</strong></span><span>${m.probability}% (Odds ~${m.fairOdds})</span>`;
        container.appendChild(row);
      });

      document.getElementById('resultsCard').style.display = 'block';
    } catch (err) {
      alert('Error fetching prediction. Please check inputs.');
    }
  }
</script>
</body>
</html>
